services:
  ctfd2022:
    build: .
    restart: always
    ports:
      - "8022:8000"
    environment:
      - SECRET_KEY=<key 1>
      - UPLOAD_FOLDER=/var/uploads
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@db2022/ctfd
      - REDIS_URL=redis://cache2022:6379
      - WORKERS=1
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
      - REVERSE_PROXY=true
    volumes:
      - .data2022/CTFd/logs:/var/log/CTFd
      - .data2022/CTFd/uploads:/var/uploads
      - .:/opt/CTFd:ro
    depends_on:
      permissions2022:
        condition: service_completed_successfully
      db2022:
        condition: service_started
      cache2022:
        condition: service_started
    networks:
        default:
        internal:

