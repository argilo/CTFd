  # TODO: CTFd 4.0 Migrate to named volumes. Users will likely need to manually migrate existing files
  permissions2022:
    image: alpine:3.23
    user: root
    volumes:
      - .data2022/CTFd/logs:/var/log/CTFd
      - .data2022/CTFd/uploads:/var/uploads
    command: chown -R 1001:1001 /var/uploads /var/log/CTFd

  permissions2023:
    image: alpine:3.23
    user: root
    volumes:
      - .data2023/CTFd/logs:/var/log/CTFd
      - .data2023/CTFd/uploads:/var/uploads
    command: chown -R 1001:1001 /var/uploads /var/log/CTFd

