worker_processes 4;

events {

  worker_connections 1024;
}

http {

  # Configuration containing list of application servers
  upstream app_servers2022 {

    server ctfd2022:8000;
  }

  upstream app_servers2023 {

    server ctfd2023:8000;
  }

  upstream app_servers2024 {

    server ctfd2024:8000;
  }

  upstream app_servers2025 {

    server ctfd2025:8000;
  }

  server {

    listen 80;
    return 301 https://$host$request_uri;
  }

  server {

    listen 443 ssl;
    server_name ctf-03.gnuradio.org ctf.gnuradio.org;

    ssl_certificate /certificates/fullchain.pem;
    ssl_certificate_key /certificates/privkey.pem;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 302 https://ctf-2025.gnuradio.org$request_uri;
  }

  server {

    listen 443 ssl;
    server_name ctf-2022.gnuradio.org;

    ssl_certificate /certificates/fullchain.pem;
    ssl_certificate_key /certificates/privkey.pem;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers HIGH:!aNULL:!MD5;

    gzip on;

    client_max_body_size 8G;

    # Handle Server Sent Events for Notifications
    location /events {

      proxy_pass http://app_servers2022;
      proxy_set_header Connection '';
      proxy_http_version 1.1;
      chunked_transfer_encoding off;
      proxy_buffering off;
      proxy_cache off;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Forwarded-Proto https;
    }

    # Proxy connections to the application servers
    location / {

      proxy_pass http://app_servers2022;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Forwarded-Proto https;

      proxy_read_timeout 3600;
      proxy_connect_timeout 3600;
      proxy_send_timeout 3600;
    }
  }

